description: |
  AIFS-single 2.0

checkpoint: model/aifs-single-mse-2.0.ckpt

input: opendata

pre_processors:
  - forward-transform-filter: cos_sin_mean_wave_direction
  - forward-transform-filter: # Mask fix
      filter: apply-mask
      param:
        - sd
        - swvl1
        - swvl2
      path: model/lsm.grib
      mask_value: 0

post_processors:
  - backward-transform-filter: cos_sin_mean_wave_direction
  - accumulate_from_start_of_forecast

patch_metadata:
  dataset:
    constant_fields: [z, sdor, slor, lsm]

use_grib_paramid: true
allow_nans: true
typed_variables:
  mwd:
    mars:
      param: mwd
      stream: wave
      levtype: sfc
  snowc: # Encoding fix
    mars:
      param: fscov
      stream: oper
      levtype: sfc
  # fscov: # required for step0 copy
  #   mars:
  #     param: fscov
  #     stream: oper
  #     levtype: sfc

output:
  grib:
    path: out/aifs_test.grib
    encoding:
      class: ai
      type: fc
      model: aifs-single
      generatingProcessIdentifier: 5

# --- local overrides (not in ECMWF's original) ---
device: cpu          # no CUDA on a Mac
lead_time: 6         # hours; one step, as a smoke test (default is 240)
